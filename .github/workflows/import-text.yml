name: Import DEADWEIGHT handover text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact handover text files
        shell: bash
        run: |
          set -euo pipefail
          archive=.bootstrap/deadweight-text.tar.xz
          if [ ! -f "$archive" ]; then
            echo "Bootstrap archive already consumed."
            exit 0
          fi
          tar -xJf "$archive"
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Import DEADWEIGHT source and text evidence"
          git push
